<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="İngilizce Takip">
  <link rel="manifest" href="manifest.json">
  <title>İngilizce Takip</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --bg1: #1a1a2e;
      --bg2: #4a1a4a;
      --card: rgba(31,41,55,0.6);
      --card-hover: rgba(31,41,55,0.8);
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(107,114,128,0.3);
      --input-bg: rgba(55,65,81,0.8);
      --nav-inactive: rgba(55,65,81,0.5);
    }
    .theme-blue   { --primary:#3b82f6; --secondary:#06b6d4; --bg1:#0f172a; --bg2:#1e3a5f; }
    .theme-green  { --primary:#10b981; --secondary:#34d399; --bg1:#052e16; --bg2:#064e3b; }
    .theme-pink   { --primary:#ec4899; --secondary:#f472b6; --bg1:#2d0a1e; --bg2:#4a1832; }
    .theme-orange { --primary:#f59e0b; --secondary:#f97316; --bg1:#1c1000; --bg2:#3d1f00; }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top:0; z-index:40;
      padding: .75rem 1rem;
    }
    .header-inner { display:flex; align-items:center; justify-content:space-between; }
    .logo { display:flex; align-items:center; gap:.6rem; }
    .logo-icon {
      width:38px; height:38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      font-size:20px;
    }
    .logo h1 { font-size:1.1rem; font-weight:700; }
    .logo p  { font-size:.75rem; color:var(--text-muted); }
    .hbtns  { display:flex; gap:.4rem; }
    .hbtn {
      padding:.4rem .5rem; border-radius:.5rem; border:none; cursor:pointer;
      background:var(--input-bg); color:var(--text); font-size:.9rem;
      transition:transform .2s;
    }
    .hbtn:active { transform:scale(.92); }
    .hbtn.grad { background:linear-gradient(135deg, var(--primary), var(--secondary)); }

    /* ── LEVEL BAR ── */
    .level-bar {
      background: rgba(0,0,0,0.3);
      padding: .4rem 1rem;
      display:flex; align-items:center; gap:.75rem;
    }
    .level-badge {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius:.5rem; padding:.2rem .6rem; font-size:.75rem; font-weight:700;
      white-space:nowrap;
    }
    .xp-bar-wrap { flex:1; height:8px; background:var(--input-bg); border-radius:99px; overflow:hidden; }
    .xp-bar-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--secondary)); border-radius:99px; transition:width .6s; }
    .xp-text { font-size:.7rem; color:var(--text-muted); white-space:nowrap; }

    /* ── NAVIGATION ── */
    .nav {
      background: rgba(0,0,0,0.25);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border);
      padding:.4rem .75rem;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .nav::-webkit-scrollbar { display:none; }
    .nav-inner { display:flex; gap:.4rem; min-width:max-content; }
    .nav-btn {
      display:flex; align-items:center; gap:.35rem;
      padding:.45rem .85rem; border-radius:.5rem; border:none; cursor:pointer;
      white-space:nowrap; font-size:.82rem; font-weight:500;
      background:var(--nav-inactive); color:var(--text-muted);
      transition:all .25s;
    }
    .nav-btn.active {
      background:linear-gradient(135deg, var(--primary), var(--secondary));
      color:#fff; transform:scale(1.04);
    }

    /* ── PAGE ── */
    .container { padding:1rem; padding-bottom:6rem; max-width:700px; margin:0 auto; }
    .page { animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── CARDS ── */
    .card {
      background:var(--card); backdrop-filter:blur(8px);
      border-radius:1rem; padding:1.25rem; margin-bottom:1rem;
      border:1px solid var(--border);
    }
    .card-title { font-size:1.05rem; font-weight:700; margin-bottom:1rem; }

    /* ── STATS GRID ── */
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin-bottom:1rem; }
    .stat-card { border-radius:1rem; padding:1rem; }
    .stat-card.purple { background:linear-gradient(135deg,#7c3aed,#5b21b6); }
    .stat-card.pink   { background:linear-gradient(135deg,#db2777,#9d174d); }
    .stat-card.blue   { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
    .stat-icon { font-size:1.5rem; margin-bottom:.35rem; }
    .stat-val  { font-size:1.6rem; font-weight:800; }
    .stat-lbl  { font-size:.72rem; opacity:.85; }

    /* ── PROGRESS ── */
    .prog-row { margin-bottom:.85rem; }
    .prog-hdr { display:flex; justify-content:space-between; margin-bottom:.35rem; font-size:.85rem; }
    .prog-bar { height:10px; background:var(--input-bg); border-radius:99px; overflow:hidden; }
    .prog-fill { height:100%; border-radius:99px; transition:width 1s ease; }
    .fill-green  { background:linear-gradient(90deg,#10b981,#059669); }
    .fill-blue   { background:linear-gradient(90deg,#3b82f6,#2563eb); }
    .fill-purple { background:linear-gradient(90deg,var(--primary),var(--secondary)); }

    /* ── DAILY QUESTS ── */
    .quest-item {
      display:flex; align-items:center; gap:.75rem;
      padding:.75rem; background:rgba(0,0,0,.25); border-radius:.75rem; margin-bottom:.5rem;
    }
    .quest-check {
      width:24px; height:24px; border-radius:50%; border:2px solid var(--primary);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      flex-shrink:0; transition:all .2s;
    }
    .quest-check.done { background:var(--primary); border-color:var(--primary); }
    .quest-text { flex:1; font-size:.88rem; }
    .quest-xp { font-size:.75rem; font-weight:700; color:var(--primary); background:rgba(139,92,246,.15); padding:.2rem .5rem; border-radius:99px; }

    /* ── ACTIVITY CARDS ── */
    .act-card {
      background:var(--card); border-radius:1rem; padding:1.1rem; margin-bottom:.85rem;
      border-left:4px solid; border-top:1px solid var(--border);
    }
    .act-head { display:flex; gap:.6rem; align-items:flex-start; margin-bottom:.75rem; }
    .act-icon { font-size:1.4rem; margin-top:.1rem; }
    .act-title { font-size:1rem; font-weight:700; }
    .act-sub { font-size:.78rem; color:var(--text-muted); margin-top:.15rem; }
    .act-desc {
      background:rgba(0,0,0,.3); border-radius:.6rem; padding:.85rem;
      font-size:.82rem; line-height:1.65; white-space:pre-wrap; color:#d1d5db;
      margin-bottom:.75rem;
    }
    .act-actions { display:flex; flex-wrap:wrap; gap:.4rem; }

    /* ── BUTTONS ── */
    .btn { padding:.45rem .9rem; border-radius:.5rem; border:none; cursor:pointer; font-size:.82rem; font-weight:600; display:inline-flex; align-items:center; gap:.35rem; transition:all .2s; }
    .btn:active { transform:scale(.94); }
    .btn.grad  { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
    .btn.gray  { background:var(--input-bg); color:var(--text); }
    .btn.green { background:rgba(16,185,129,.2); color:#10b981; }
    .btn.red   { background:rgba(239,68,68,.2); color:#ef4444; }
    .btn.yellow{ background:rgba(234,179,8,.2); color:#eab308; }
    .btn-block { width:100%; justify-content:center; padding:.75rem; font-size:.95rem; border-radius:.75rem; }

    /* ── VOCAB ── */
    .vocab-card {
      background:var(--card); border-radius:.85rem; padding:.9rem; margin-bottom:.6rem;
      display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem;
    }
    .vocab-card.review { border:2px solid #eab308; }
    .vocab-word { font-size:1.05rem; font-weight:700; margin-bottom:.2rem; }
    .vocab-tr   { font-size:.85rem; color:var(--text-muted); margin-bottom:.3rem; }
    .vocab-sent { font-size:.75rem; font-style:italic; color:#6b7280; margin-bottom:.4rem; }
    .vocab-meta { display:flex; flex-wrap:wrap; gap:.35rem; font-size:.72rem; }
    .tag { background:rgba(139,92,246,.15); color:var(--primary); padding:.15rem .45rem; border-radius:99px; }
    .tag.warn { background:rgba(234,179,8,.2); color:#eab308; }
    .vocab-btns { display:flex; gap:.35rem; flex-shrink:0; }
    .icon-btn { width:34px; height:34px; border-radius:.5rem; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem; transition:transform .2s; }
    .icon-btn:active { transform:scale(.9); }
    .icon-btn.gray  { background:var(--input-bg); }
    .icon-btn.warn  { background:rgba(234,179,8,.2); }
    .icon-btn.red   { background:rgba(239,68,68,.15); }

    /* ── TIMER ── */
    .timer-wrap { text-align:center; padding:1.5rem 0; }
    .timer-clock { font-size:4.5rem; font-weight:800; font-family:'Courier New',monospace; letter-spacing:.05em; }
    .pomodoro-phase { display:inline-block; padding:.35rem 1rem; border-radius:.5rem; font-size:.85rem; font-weight:600; margin:.75rem 0; }
    .phase-work  { background:rgba(239,68,68,.25); color:#ef4444; }
    .phase-break { background:rgba(16,185,129,.25); color:#10b981; }
    .timer-btns { display:flex; justify-content:center; gap:1rem; margin:1.25rem 0; }
    .tbtn { width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:1.6rem; transition:transform .2s; box-shadow:0 4px 12px rgba(0,0,0,.3); }
    .tbtn:active { transform:scale(.92); }
    .tbtn.play  { background:linear-gradient(135deg,var(--primary),var(--secondary)); }
    .tbtn.pause { background:#eab308; }
    .tbtn.reset { background:var(--input-bg); }
    .tbtn.done  { background:#10b981; }
    .presets { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
    .preset-btn { padding:.65rem; border-radius:.5rem; border:none; cursor:pointer; background:var(--input-bg); color:var(--text); font-weight:600; font-size:.85rem; transition:all .2s; }
    .preset-btn:active { background:linear-gradient(135deg,var(--primary),var(--secondary)); transform:scale(.95); }

    /* ── GAMES ── */
    .game-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem; }
    .game-card { background:var(--card); border-radius:1rem; padding:1.25rem; text-align:center; cursor:pointer; transition:transform .2s; border:1px solid var(--border); }
    .game-card:active { transform:scale(.96); }
    .game-icon { font-size:2.5rem; margin-bottom:.5rem; }
    .game-name { font-weight:700; margin-bottom:.25rem; }
    .game-desc { font-size:.78rem; color:var(--text-muted); }

    /* ── FLASHCARD ── */
    .flashcard {
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      border-radius:1.25rem; padding:2.5rem 1.5rem; text-align:center;
      min-height:180px; display:flex; flex-direction:column; justify-content:center;
      cursor:pointer; margin-bottom:1rem; transition:transform .15s;
    }
    .flashcard:active { transform:scale(.97); }
    .fc-word { font-size:2rem; font-weight:800; margin-bottom:.5rem; }
    .fc-hint { font-size:.85rem; opacity:.75; }
    .fc-answer { font-size:1.2rem; font-weight:600; margin-top:.75rem; padding-top:.75rem; border-top:1px solid rgba(255,255,255,.3); }
    .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    .opt-btn { padding:.85rem; border-radius:.75rem; border:2px solid var(--border); background:var(--card); color:var(--text); font-size:.9rem; font-weight:600; cursor:pointer; transition:all .2s; }
    .opt-btn.correct { border-color:#10b981; background:rgba(16,185,129,.2); }
    .opt-btn.wrong   { border-color:#ef4444; background:rgba(239,68,68,.2); }

    /* ── MEMORY GAME ── */
    .memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
    .mem-card {
      aspect-ratio:1; border-radius:.6rem; border:2px solid var(--border);
      background:var(--input-bg); cursor:pointer; display:flex; align-items:center;
      justify-content:center; font-size:.75rem; font-weight:600; text-align:center;
      padding:.2rem; transition:all .3s;
    }
    .mem-card.flipped { background:linear-gradient(135deg,var(--primary),var(--secondary)); border-color:transparent; }
    .mem-card.matched { background:rgba(16,185,129,.3); border-color:#10b981; }

    /* ── BADGES ── */
    .badge-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
    .badge-card { border-radius:1rem; padding:1rem; text-align:center; transition:transform .2s; }
    .badge-card.earned { background:linear-gradient(135deg,#d97706,#b45309); transform:scale(1.03); box-shadow:0 6px 20px rgba(217,119,6,.3); }
    .badge-card.locked { background:rgba(31,41,55,.3); opacity:.45; }
    .badge-emoji { font-size:2.2rem; margin-bottom:.4rem; }
    .badge-name  { font-size:.78rem; font-weight:700; margin-bottom:.2rem; }
    .badge-desc  { font-size:.68rem; color:var(--text-muted); }

    /* ── CERTIFICATE ── */
    #certCanvas { max-width:100%; border-radius:1rem; display:block; margin:0 auto; }

    /* ── STATS PAGE ── */
    .history-item { display:flex; justify-content:space-between; align-items:center; padding:.75rem; background:rgba(0,0,0,.25); border-radius:.6rem; margin-bottom:.4rem; }
    .history-icon { font-size:1.1rem; margin-right:.5rem; }
    .history-info { flex:1; }
    .history-name { font-size:.88rem; font-weight:600; }
    .history-date { font-size:.73rem; color:var(--text-muted); }
    .history-dur  { font-family:monospace; font-size:.85rem; font-weight:700; color:var(--primary); }

    /* ── MUSIC PLAYER ── */
    .music-bar {
      position:fixed; bottom:5rem; left:1rem; right:5rem;
      background:rgba(0,0,0,.7); backdrop-filter:blur(10px);
      border-radius:1rem; padding:.6rem .9rem;
      display:flex; align-items:center; gap:.75rem;
      border:1px solid var(--border); z-index:43;
    }
    .music-dot { width:10px; height:10px; border-radius:50%; background:var(--primary); animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
    .music-name { flex:1; font-size:.8rem; font-weight:600; }
    .music-btn { width:28px; height:28px; border-radius:50%; border:none; cursor:pointer; background:var(--input-bg); color:var(--text); font-size:.75rem; display:flex; align-items:center; justify-content:center; }

    /* ── MODAL ── */
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:50; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn .25s; }
    .modal-box { background:#1f2937; border-radius:1rem; padding:1.25rem; max-width:480px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid var(--border); }
    .modal-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem; }
    .modal-title { font-size:1.1rem; font-weight:700; }
    .close-btn { background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer; }
    .form-group { margin-bottom:.85rem; }
    .form-label { display:block; margin-bottom:.35rem; color:#d1d5db; font-size:.85rem; }
    .form-input, .form-textarea { width:100%; padding:.7rem; border-radius:.5rem; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:.95rem; font-family:inherit; }
    .form-textarea { resize:none; }
    .modal-actions { display:flex; gap:.6rem; margin-top:1.1rem; }

    /* ── FAB ── */
    .fab { position:fixed; bottom:1.5rem; right:1.5rem; width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.6rem; box-shadow:0 6px 20px rgba(139,92,246,.4); z-index:45; transition:transform .25s; }
    .fab:active { transform:scale(.9); }
    .fab-menu { position:fixed; bottom:5.5rem; right:1.5rem; display:flex; flex-direction:column; gap:.5rem; z-index:44; }
    .fab-item { display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem; background:#1f2937; border-radius:99px; border:none; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.3); font-size:.88rem; font-weight:600; color:var(--text); white-space:nowrap; animation:slideUp .2s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ── CONFETTI ── */
    .confetti-piece { position:fixed; width:10px; height:10px; top:-10px; z-index:99; border-radius:2px; animation:confettiFall linear forwards; pointer-events:none; }
    @keyframes confettiFall { to { transform:translateY(100vh) rotate(720deg); opacity:0; } }

    /* ── NOTIFICATION ── */
    .notif { position:fixed; top:5rem; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; padding:.75rem 1.25rem; border-radius:1rem; font-weight:600; font-size:.9rem; z-index:100; animation:notifIn .4s ease; box-shadow:0 8px 24px rgba(0,0,0,.3); white-space:nowrap; }
    @keyframes notifIn { from{opacity:0;transform:translateX(-50%) translateY(-20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* ── INSTALL BANNER ── */
    .install-banner { background:linear-gradient(135deg,var(--primary),var(--secondary)); padding:.75rem 1rem; text-align:center; position:relative; }
    .install-banner p { font-size:.85rem; margin-bottom:.35rem; }

    /* ── MISC ── */
    .hidden { display:none !important; }
    .section-title { font-size:1.2rem; font-weight:700; margin-bottom:1rem; }
    select { background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:.5rem; padding:.5rem; font-size:.9rem; }

    @supports (padding-top: env(safe-area-inset-top)) {
      .header { padding-top: max(.75rem, env(safe-area-inset-top)); }
      .fab    { bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<!-- Install Banner -->
<div id="installBanner" class="install-banner hidden">
  <p>📱 Ana ekrana ekleyerek uygulama gibi kullanın!</p>
  <div style="display:flex;gap:.5rem;justify-content:center;">
    <button class="btn grad" onclick="installApp()">📲 Yükle</button>
    <button class="btn gray" onclick="closeInstallBanner()">Kapat</button>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <h1>İngilizce Takip</h1>
        <p id="streakText">0 gün streak 🔥</p>
      </div>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="showThemes()" title="Tema">🎨</button>
      <button class="hbtn" id="musicToggleBtn" onclick="toggleMusic()" title="Müzik">🎵</button>
      <button class="hbtn grad" onclick="toggleFABMenu()">☰</button>
    </div>
  </div>
</div>

<!-- Level Bar -->
<div class="level-bar">
  <div class="level-badge" id="levelBadge">⭐ Lv 1</div>
  <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBar" style="width:0%"></div></div>
  <div class="xp-text" id="xpText">0 / 100 XP</div>
</div>

<!-- Navigation -->
<div class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" onclick="showPage('dashboard')" data-page="dashboard">📊 Ana Sayfa</button>
    <button class="nav-btn" onclick="showPage('activities')" data-page="activities">✅ Aktiviteler</button>
    <button class="nav-btn" onclick="showPage('vocabulary')" data-page="vocabulary">📚 Kelimeler</button>
    <button class="nav-btn" onclick="showPage('timer')" data-page="timer">⏱️ Zamanlayıcı</button>
    <button class="nav-btn" onclick="showPage('games')" data-page="games">🎮 Oyunlar</button>
    <button class="nav-btn" onclick="showPage('stats')" data-page="stats">📈 İstatistik</button>
    <button class="nav-btn" onclick="showPage('badges')" data-page="badges">🏆 Rozetler</button>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <div id="dashboardPage"  class="page"></div>
  <div id="activitiesPage" class="page hidden"></div>
  <div id="vocabularyPage" class="page hidden"></div>
  <div id="timerPage"      class="page hidden"></div>
  <div id="gamesPage"      class="page hidden"></div>
  <div id="statsPage"      class="page hidden"></div>
  <div id="badgesPage"     class="page hidden"></div>
</div>

<!-- Music Bar -->
<div id="musicBar" class="music-bar hidden">
  <div class="music-dot"></div>
  <div class="music-name" id="musicName">Lo-fi Beats</div>
  <button class="music-btn" onclick="prevTrack()">⏮</button>
